<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colstone - Visualizador de Cocinas 3D</title>
    <!-- Importar el componente model-viewer de Google -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: #222222;
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            background-color: #111111;
            color: white;
            border: none;
            padding: 10px 22px;
            margin: 0 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #444444;
        }
        model-viewer {
            width: 92vw;
            height: 78vh;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="title">SAMOA KITCHEN</h1>
    </header>

    <div class="controls">
        <button onclick="changeModel('SAMOA KITCHEN', 'samoa-kitchen.glb')">Samoa Kitchen</button>
        <button onclick="changeModel('IBIZA KITCHEN', 'ibiza-kitchen.glb')">Ibiza Kitchen</button>
    </div>

    <!-- Visor 3D con rutas corregidas -->
    <script>
        document.write(`
            <model-viewer id="viewer" 
                src="samoa-kitchen.glb" 
                alt="Colstone 3D Kitchen Viewer" 
                auto-rotate 
                camera-controls 
                shadow-intensity="2"
                shadow-softness="0.8"
                exposure="1.1"
                environment-image="neutral"
                camera-orbit="45deg 55deg 2.5m">
            </model-viewer>
        `);

        function changeModel(name, fileName) {
            document.getElementById('title').innerText = name;
            const viewer = document.getElementById('viewer');
            viewer.src = fileName;
        }
    </script>

</body>
</html>
